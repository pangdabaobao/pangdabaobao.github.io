<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>盒子模型</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
          135deg,
          #f5e050 0%,
          #e8c820 30%,
          #9b59b6 70%,
          #8e44ad 100%
        );
        background-size: 200% 200%;
      }

      /* 黄色大盒子 - 正方形圆角 */
      .box-yellow {
        width: 400px;
        height: 400px;
        background: #ffd700;
        border-radius: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 白色盒子 - 横置长方形圆角 */
      .box-white {
        width: 300px;
        height: 200px;
        background: white;
        border-radius: 25px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 紫色盒子 - 横置长方形尖角 */
      .box-purple {
        width: 200px;
        height: 120px;
        background: #9b59b6;
        border-radius: 0px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 白色圆 */
      .circle-white {
        width: 60px;
        height: 60px;
        background: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 底朝左的等腰三角形 */
      .triangle-left {
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 15px 20px 15px 0;
        border-color: transparent #8e44ad transparent transparent;
      }
    </style>
  </head>
  <body>
    <div class="box-yellow">
      <div class="box-white">
        <div class="box-purple">
          <div class="circle-white">
            <div class="triangle-left"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
